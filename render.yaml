services:
  - type: web
    name: educity-api
    runtime: docker
    plan: free
    branch: feature/laravel-backend
    autoDeployTrigger: commit
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: >-
      php artisan migrate --force && php artisan db:seed --class=EducitySeeder --force &&
      php artisan config:cache && php artisan route:cache && php artisan view:cache
    envVars:
      - key: APP_NAME
        value: Educity
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://educity-api.onrender.com
      - key: FRONTEND_URL
        value: https://educity-t9jo-git-feature-larave-070258-kakulmanav-dots-projects.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://educity-t9jo-git-feature-larave-070258-kakulmanav-dots-projects.vercel.app
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: educity-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: educity-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: educity-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: educity-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: educity-postgres
          property: password
      - key: DB_SSLMODE
        value: prefer
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MEDIA_DRIVER
        value: local
      - key: MAIL_MAILER
        value: log
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: educity-postgres
    plan: free
